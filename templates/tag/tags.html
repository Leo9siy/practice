{% extends "base.html" %}
{% block title %}Tags{% endblock %}
{% block content %}
  {% load static %}
  <link rel="stylesheet" type="text/css" href="{% static 'tag/list.css'%}">

  <div class="tags-page">
    <div class="head">
      <h1>Tags</h1>
      <a class="btn btn-primary" href="{% url 'main:tag_create' %}">Add</a>
    </div>

    <table>
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
        {% for tag in tags_list %}
          <tr>
            <td>{{ tag.name }}</td>
            <td><a class="btn btn-secondary" href="{% url 'main:tag_update' tag.id %}">Update</a></td>
            <td><a class="btn btn-secondary" href="{% url 'main:tag_delete' tag.id %}">Delete</a></td>
          </tr>

        {% empty %}
          <p>No one tag was found</p>
        {% endfor %}

    </table>
  </div>


{% endblock %}
