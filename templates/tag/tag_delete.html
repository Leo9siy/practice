{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block title %}Delete {% endblock %}
{% block content %}
  <div class="page">
    <h1>Delete {{ tag.name }}?</h1>
    <form action="" method="post" novalidate>
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-danger" type="submit" value="yes">Delete</button>
      <a class="btn btn-secondary" href="{% url 'main:tag_list' %}">Back</a>
    </form>
  </div>
{% endblock %}
